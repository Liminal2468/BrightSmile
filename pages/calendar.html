<div class="calendar-app">
    <div class="calendar-toolbar">
        <button id="cal-today" class="cal-today-btn" type="button">Today</button>
        <div class="calendar-nav">
            <button id="cal-prev" class="cal-nav-btn" type="button" aria-label="Previous month">&#8249;</button>
            <button id="cal-next" class="cal-nav-btn" type="button" aria-label="Next month">&#8250;</button>
        </div>
        <h2 id="cal-title" class="calendar-title"></h2>
    </div>

    <div class="calendar-weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
        <div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div id="cal-grid" class="calendar-grid"></div>
</div>

<dialog id="cal-event-modal" class="cal-event-modal">
    <form id="cal-event-form" class="cal-event-form">
        <h3 id="cal-modal-date"></h3>

        <label for="cal-event-time">Time</label>
        <input id="cal-event-time" type="time" required>

        <label for="cal-event-title">Patient / Title</label>
        <input id="cal-event-title" type="text" placeholder="e.g. John Doe - Cleaning" required>

        <label for="cal-event-notes">Notes</label>
        <textarea id="cal-event-notes" rows="3" placeholder="Optional notes"></textarea>

        <div class="cal-modal-actions">
            <button type="button" id="cal-delete" class="cal-delete-btn" hidden>Delete</button>
            <span class="cal-modal-spacer"></span>
            <button type="button" id="cal-cancel">Cancel</button>
            <button type="submit" class="cal-save">Save</button>
        </div>
    </form>
</dialog>

<style>
    .calendar-app {
        --cal-accent: var(--accent, #0f9a9a);
        --cal-today: var(--accent-tint, #eafaf3);
        --cal-border: var(--border-soft, #cdece4);
        --cal-muted: #7c9d97;
        background: var(--bg-sidebar, #fff);
        border: 1px solid var(--cal-border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        overflow: hidden;
    }

    .calendar-toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--cal-border);
        flex: 0 0 auto;
    }

    .cal-today-btn,
    .cal-nav-btn {
        border: 1px solid var(--cal-border);
        background: #fff;
        color: var(--text-page, #123c38);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 0.9rem;
    }

    .cal-today-btn:hover,
    .cal-nav-btn:hover {
        background: var(--cal-today);
    }

    .calendar-nav {
        display: flex;
        gap: 4px;
    }

    .cal-nav-btn {
        padding: 6px 10px;
        font-size: 1rem;
        line-height: 1;
    }

    .calendar-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-page, #123c38);
        margin: 0;
    }

    .calendar-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--cal-muted);
        padding: 8px 0;
        border-bottom: 1px solid var(--cal-border);
        flex: 0 0 auto;
    }

    .calendar-grid {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-auto-rows: minmax(90px, 1fr);
    }

    .cal-day {
        border-right: 1px solid var(--cal-border);
        border-bottom: 1px solid var(--cal-border);
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
        min-width: 0;
    }

    .cal-day:hover {
        background: var(--cal-today);
    }

    .cal-day.cal-other-month {
        color: var(--cal-muted);
        background: #fafdfc;
    }

    .cal-day.cal-today {
        background: var(--cal-today);
    }

    .cal-day-number {
        font-size: 0.85rem;
        font-weight: 600;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        flex: 0 0 auto;
    }

    .cal-day.cal-today .cal-day-number {
        background: var(--cal-accent);
        color: #fff;
    }

    .cal-events {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
    }

    .cal-event-chip {
        background: var(--cal-accent);
        color: #fff;
        font-size: 0.72rem;
        padding: 2px 5px;
        border-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .cal-event-chip:hover {
        filter: brightness(0.9);
    }

    .cal-more {
        font-size: 0.7rem;
        color: var(--cal-muted);
        padding-left: 5px;
    }

    .cal-event-modal {
        width: min(90vw, 26rem);
        padding: 0;
        border: 0;
        border-radius: 0.8rem;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 30%);
    }

    .cal-event-modal::backdrop {
        background: rgb(0 0 0 / 42%);
    }

    .cal-event-form {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 1.3rem;
    }

    .cal-event-form h3 {
        margin: 0 0 0.3rem;
        color: var(--text-page, #123c38);
    }

    .cal-event-form input,
    .cal-event-form textarea {
        width: 100%;
        border: 1px solid var(--cal-border);
        border-radius: 0.4rem;
        padding: 0.5rem;
        font: inherit;
        resize: vertical;
    }

    .cal-modal-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.4rem;
    }

    .cal-modal-spacer {
        flex: 1;
    }

    .cal-modal-actions button {
        border: 1px solid var(--cal-border);
        background: #fff;
        border-radius: 0.4rem;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font: inherit;
    }

    .cal-save {
        border-color: var(--cal-accent) !important;
        background: var(--cal-accent) !important;
        color: #fff;
    }

    .cal-delete-btn {
        border-color: #c0392b !important;
        color: #c0392b;
    }
</style>

<script>
(() => {
    const STORAGE_KEY = 'clinicCalendarAppointments';
    const MONTH_NAMES = ["January","February","March","April","May","June",
        "July","August","September","October","November","December"];

    const grid = document.getElementById('cal-grid');
    const titleEl = document.getElementById('cal-title');
    const modal = document.getElementById('cal-event-modal');
    const form = document.getElementById('cal-event-form');
    const modalDateEl = document.getElementById('cal-modal-date');
    const timeInput = document.getElementById('cal-event-time');
    const titleInput = document.getElementById('cal-event-title');
    const notesInput = document.getElementById('cal-event-notes');
    const deleteBtn = document.getElementById('cal-delete');
    const cancelBtn = document.getElementById('cal-cancel');

    const today = new Date();
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();
    let editingKey = null;   // date string being edited
    let editingIndex = null; // index within that date's array, or null if adding

    function loadAppointments() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch {
            return {};
        }
    }

    function saveAppointments(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function dateKey(y, m, d) {
        return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function formatTime(hhmm) {
        const [h, m] = hhmm.split(':').map(Number);
        const period = h >= 12 ? 'PM' : 'AM';
        const hour12 = h % 12 === 0 ? 12 : h % 12;
        return `${hour12}:${String(m).padStart(2, '0')} ${period}`;
    }

    function openModal(y, m, d, index = null) {
        const key = dateKey(y, m, d);
        editingKey = key;
        editingIndex = index;

        const dateObj = new Date(y, m, d);
        modalDateEl.textContent = dateObj.toLocaleDateString(undefined, {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        if (index !== null) {
            const appt = loadAppointments()[key][index];
            timeInput.value = appt.time;
            titleInput.value = appt.title;
            notesInput.value = appt.notes || '';
            deleteBtn.hidden = false;
        } else {
            form.reset();
            deleteBtn.hidden = true;
        }

        modal.showModal();
    }

    form.addEventListener('submit', event => {
        event.preventDefault();
        const data = loadAppointments();
        const list = data[editingKey] || (data[editingKey] = []);
        const entry = { time: timeInput.value, title: titleInput.value.trim(), notes: notesInput.value.trim() };

        if (editingIndex !== null) {
            list[editingIndex] = entry;
        } else {
            list.push(entry);
        }
        list.sort((a, b) => a.time.localeCompare(b.time));

        saveAppointments(data);
        modal.close();
        render();
    });

    deleteBtn.addEventListener('click', () => {
        const data = loadAppointments();
        if (data[editingKey]) {
            data[editingKey].splice(editingIndex, 1);
            if (!data[editingKey].length) delete data[editingKey];
            saveAppointments(data);
        }
        modal.close();
        render();
    });

    cancelBtn.addEventListener('click', () => modal.close());
    modal.addEventListener('click', event => {
        if (event.target === modal) modal.close();
    });

    document.getElementById('cal-prev').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        render();
    });

    document.getElementById('cal-next').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        render();
    });

    document.getElementById('cal-today').addEventListener('click', () => {
        viewYear = today.getFullYear();
        viewMonth = today.getMonth();
        render();
    });

    function render() {
        titleEl.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
        grid.innerHTML = '';

        const appointments = loadAppointments();
        const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
        const totalCells = 42;

        for (let i = 0; i < totalCells; i++) {
            const dayOffset = i - firstWeekday + 1;
            let cellYear = viewYear, cellMonth = viewMonth, cellDay, otherMonth = false;

            if (dayOffset < 1) {
                cellDay = daysInPrevMonth + dayOffset;
                cellMonth = viewMonth - 1;
                if (cellMonth < 0) { cellMonth = 11; cellYear--; }
                otherMonth = true;
            } else if (dayOffset > daysInMonth) {
                cellDay = dayOffset - daysInMonth;
                cellMonth = viewMonth + 1;
                if (cellMonth > 11) { cellMonth = 0; cellYear++; }
                otherMonth = true;
            } else {
                cellDay = dayOffset;
            }

            const cell = document.createElement('div');
            cell.className = 'cal-day' + (otherMonth ? ' cal-other-month' : '');

            const isToday = !otherMonth && cellYear === today.getFullYear()
                && cellMonth === today.getMonth() && cellDay === today.getDate();
            if (isToday) cell.classList.add('cal-today');

            const numberEl = document.createElement('div');
            numberEl.className = 'cal-day-number';
            numberEl.textContent = cellDay;
            cell.appendChild(numberEl);

            const key = dateKey(cellYear, cellMonth, cellDay);
            const dayAppointments = appointments[key] || [];
            const eventsEl = document.createElement('div');
            eventsEl.className = 'cal-events';

            dayAppointments.slice(0, 3).forEach((appt, index) => {
                const chip = document.createElement('div');
                chip.className = 'cal-event-chip';
                chip.textContent = `${formatTime(appt.time)} ${appt.title}`;
                chip.addEventListener('click', event => {
                    event.stopPropagation();
                    openModal(cellYear, cellMonth, cellDay, index);
                });
                eventsEl.appendChild(chip);
            });

            if (dayAppointments.length > 3) {
                const more = document.createElement('div');
                more.className = 'cal-more';
                more.textContent = `+${dayAppointments.length - 3} more`;
                eventsEl.appendChild(more);
            }

            cell.appendChild(eventsEl);

            cell.addEventListener('click', () => {
                if (otherMonth) {
                    viewYear = cellYear;
                    viewMonth = cellMonth;
                    render();
                }
                openModal(cellYear, cellMonth, cellDay);
            });

            grid.appendChild(cell);
        }
    }

    render();
})();
</script>
